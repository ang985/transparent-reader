<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Microsoft YaHei UI", "Segoe UI", sans-serif;
    -webkit-user-select: none;
    user-select: none;
  }
  .pill {
    width: 100%; height: 100%;
    display: flex; align-items: center;
    padding: 0 4px 0 10px;
    border-radius: 9px;
    background: rgba(255, 255, 255, 0.94);
    border: 1px solid rgba(0, 0, 0, 0.16);
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.18), inset 0 0 0 1px rgba(255, 255, 255, 0.7);
    -webkit-app-region: drag;
  }
  .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #2ea043;
    box-shadow: 0 0 0 2px rgba(46, 160, 67, 0.18);
    flex: none;
    margin-right: 7px;
  }
  .label {
    flex: 1;
    min-width: 0;
    font-size: 12px;
    color: #3a3f47;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: 0.2px;
  }
  button {
    -webkit-app-region: no-drag;
    flex: none;
    height: 24px;
    padding: 0 10px;
    margin-left: 6px;
    border: 1px solid rgba(11, 78, 162, 0.28);
    border-radius: 5px;
    background: rgba(11, 78, 162, 0.10);
    color: #0b4ea2;
    font-size: 12px;
    font-family: inherit;
    cursor: pointer;
    outline: none;
  }
  button:hover { background: rgba(11, 78, 162, 0.20); }
  button:active { background: rgba(11, 78, 162, 0.30); }
</style>
</head>
<body>
  <div class="pill" id="pill" title="按 Alt+Q 或点「展开」恢复阅读层">
    <span class="dot"></span>
    <span class="label" id="label">阅读层已收起</span>
    <button id="expand" title="展开阅读层（Alt+Q）">展开</button>
  </div>
  <script>
    (function () {
      var label = document.getElementById('label');
      try {
        window.vrMini.info().then(function (d) {
          if (d && d.title) label.textContent = d.title;
        }).catch(function () {});
      } catch (e) {}

      document.getElementById('expand').addEventListener('click', function (ev) {
        ev.preventDefault();
        ev.stopPropagation();
        try { window.vrMini.expand(); } catch (e) {}
      });

      // 双击胶囊任意位置也能展开
      document.getElementById('pill').addEventListener('dblclick', function () {
        try { window.vrMini.expand(); } catch (e) {}
      });

      // 胶囊有焦点时，Alt+Q 也能展开（和收起用的是同一个键）
      window.addEventListener('keydown', function (e) {
        if (e.altKey && !e.ctrlKey && !e.metaKey && String(e.key).toLowerCase() === 'q') {
          e.preventDefault();
          try { window.vrMini.expand(); } catch (err) {}
        }
      });
    })();
  </script>
</body>
</html>
